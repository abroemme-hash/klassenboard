<title>Klassenboard U-Bahn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Idee: Der Tag ist eine U-Bahn-Linie. Jede Stunde ist eine Haltestelle, "Du bist hier" zeigt die aktuelle.
   Format: feste Bühne 16:9, die sich in das Fenster einpasst. Alle Größen in cqw (1 % der Bühnenbreite),
   dadurch sieht das Board auf jedem Bildschirm gleich aus.
   Schrift: Lexend, lokal eingebunden (für Lesen mit LRS entwickelt, weite Buchstabenabstände). */
@font-face{font-family:'Lexend';src:url('fonts/Lexend.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --paper:#F6FAFE; --ink:#1B2744; --pencil:#2B3A66; --acc:#C8334D; --line:#E0475F; --blue:#1F59A8;
  --w1:#F8D56B; --w2:#F5A3B7; --w3:#98D9BE; --w4:#9CC8F2; --w5:#F7BA8C; --board:#F7D63C;
  --rad:26px 34px 22px 38px / 34px 22px 38px 26px;
  --rad-s:16px 22px 14px 24px / 22px 14px 24px 16px;
  --f:'Lexend','Verdana','Arial',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
h1,h2,p{margin:0}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--ink);font-family:var(--f);
  background:var(--paper) url("img/papier.jpg") center/cover fixed;
  display:grid;place-items:center;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--w4);outline-offset:3px}
.tab{font-variant-numeric:tabular-nums}

/* ---------- Bühne 16:9 ---------- */
.stage{
  position:relative;container-type:size;
  width:min(calc(100vw - 32px),calc((100vh - 16px) * 16 / 9));
  height:min(calc((100vw - 32px) * 9 / 16),calc(100vh - 16px));
  font-size:1.12cqw;line-height:1.25;hyphens:auto;
  display:grid;gap:1.1cqw;padding:1.2cqw;
  grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);
  grid-template-rows:9.6cqw minmax(0,1fr) 15.2cqw 8cqw;
  grid-template-areas:"head head head" "day now timer" "line line line" "spruch spruch spruch";
}
.head{grid-area:head}.day{grid-area:day}.now{grid-area:now}.timer{grid-area:timer}.lineblk{grid-area:line}.spruch{grid-area:spruch}
.day{--tone:var(--w4)}.now{--tone:var(--w1)}.lineblk{--tone:var(--w5)}.spruch{--tone:var(--w2)}

/* ---------- Karte: Buntstiftrahmen + Aquarellfläche ---------- */
.panel{position:relative;isolation:isolate;padding:1.1cqw 1.5cqw;min-width:0;min-height:0;--fill:#fff}
.panel::before{
  content:"";position:absolute;inset:0;z-index:-2;border:.2cqw solid var(--pencil);border-radius:var(--rad);
  background:var(--fill);filter:url(#rough);
}
.panel::after{
  content:"";position:absolute;inset:.4cqw;z-index:-1;pointer-events:none;opacity:.75;mix-blend-mode:multiply;
  background:
    radial-gradient(60% 75% at 12% 18%,var(--tone) 0%,transparent 72%),
    radial-gradient(42% 55% at 94% 90%,var(--tone) 0%,transparent 70%);
  filter:url(#wash);
}
.tag{font-weight:600;font-size:1.5cqw;color:var(--acc);display:block;margin-bottom:.3cqw}

/* ---------- Kopf ---------- */
.head{
  position:relative;display:flex;align-items:center;padding:0 2cqw;border-radius:var(--rad);
  border:.2cqw solid var(--pencil);background:#cfe6fa url("img/skyline.jpg") center 78%/cover;
  box-shadow:.25cqw .25cqw 0 rgba(27,39,68,.18);
}
.greet-text{position:relative;z-index:2;min-width:0;max-width:62%;background:rgba(255,255,255,.84);padding:.5cqw 1.6cqw .6cqw;border-radius:var(--rad-s);border:.16cqw solid var(--pencil)}
.greet-text h1{font-weight:700;font-size:3.4cqw;line-height:1.05;color:var(--acc);text-shadow:0 0 .5cqw #fff,0 0 .2cqw #fff,.1cqw .1cqw 0 #fff}
.greet-text .sub{font-weight:500;font-size:1.6cqw;margin-top:.4cqw;text-shadow:0 0 .5cqw #fff,0 0 .2cqw #fff,.1cqw .1cqw 0 #fff}
.baer{position:absolute;right:1.5%;bottom:-.3cqw;height:106%;width:auto;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent);mask-image:radial-gradient(closest-side,#000 78%,transparent);pointer-events:none;z-index:1}
.bubble{
  position:absolute;z-index:3;right:calc(1.5% + 12.5cqw);top:1.1cqw;font-weight:600;font-size:1.9cqw;background:#fff;
  border:.2cqw solid var(--pencil);border-radius:var(--rad-s);padding:.2cqw 1.2cqw;transform:rotate(3deg);
  box-shadow:.2cqw .2cqw 0 rgba(27,39,68,.2);
}
.bubble::after{content:"";position:absolute;left:1.4cqw;bottom:-.75cqw;width:1.1cqw;height:1.1cqw;background:#fff;border-right:.2cqw solid var(--pencil);border-bottom:.2cqw solid var(--pencil);transform:rotate(45deg) skew(8deg,8deg)}

/* ---------- Tag + Datum ---------- */
.wd{font-weight:700;font-size:4cqw;line-height:1.05;overflow-wrap:break-word}
.date-de{font-weight:500;font-size:2.2cqw;line-height:1.15;margin-top:.5cqw}
.sep{border:0;border-top:.15cqw dashed var(--pencil);opacity:.4;margin:.8cqw 0}
.date-en{font-weight:500;font-size:1.7cqw;line-height:1.2;color:var(--blue)}

/* ---------- Jetzt + Gleich ---------- */
.now-main{display:flex;align-items:center;gap:1.2cqw}
.bigchip{
  width:7cqw;height:7cqw;border-radius:50% 46% 52% 48%;flex:none;font-size:0;
  background:var(--sc,#fff) center/cover no-repeat;border:.22cqw solid var(--pencil);box-shadow:0 0 0 .26cqw var(--sc,transparent);
}
.now-name{font-weight:700;font-size:3cqw;line-height:1.05}
.now-time{font-weight:400;font-size:1.5cqw;margin-top:.3cqw}
.now-left{font-weight:600;color:var(--acc);font-size:1.5cqw;margin-top:.1cqw}
.next{
  margin-top:.9cqw;padding-top:.8cqw;border-top:.15cqw dashed var(--pencil);display:flex;align-items:center;gap:.9cqw;flex-wrap:wrap;
  font-weight:600;font-size:1.8cqw;
}
.next .chip{
  width:3.6cqw;height:3.6cqw;border-radius:50% 46% 52% 48%;flex:none;font-size:0;
  background:var(--sc,#fff) var(--img) center/cover no-repeat;border:.16cqw solid var(--pencil);box-shadow:0 0 0 .16cqw var(--sc,transparent);
}
.next small{font-weight:400;font-size:1.3cqw;opacity:.85}

/* ---------- Abfahrtstafel-Timer ---------- */
.timer{--fill:var(--board);--tone:var(--w1);display:flex;flex-direction:column;justify-content:space-between}
.timer::after{opacity:.3}
.timer .tag{color:var(--ink);font-size:1.8cqw;margin-bottom:0}
.clock{font-weight:700;line-height:1;font-size:5.2cqw;display:flex;align-items:center;color:var(--ink)}
.clock #cMin,.clock #cSec{display:inline-block;min-width:1.3em;text-align:center}
.clock .colon{opacity:.6;padding-bottom:.08em}
.clock.warn{color:var(--acc)}
.clock.done{animation:blink .6s steps(2) infinite;color:var(--acc)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clock.done{animation:none}}
.bar{height:1.1cqw;border:.18cqw solid var(--pencil);border-radius:var(--rad-s);background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--line);transition:width .4s linear;border-right:.15cqw solid var(--pencil)}
.ctl{display:flex;flex-wrap:wrap;gap:.5cqw;align-items:center}
.btn{
  appearance:none;border:.16cqw solid var(--pencil);border-radius:var(--rad-s);background:#fff;font-weight:600;
  font-size:1.25cqw;padding:.1cqw .9cqw;min-height:2.6cqw;min-width:2.6cqw;box-shadow:.15cqw .15cqw 0 rgba(27,39,68,.25);
}
.btn:active{transform:translate(.15cqw,.15cqw);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--acc);color:#fff;font-size:1.7cqw;padding:.1cqw 2.2cqw;min-height:3.1cqw}

/* ---------- Die Linie ---------- */
.lineblk{display:grid;grid-template-rows:auto 1fr;padding-block:.9cqw .8cqw}
.line-head{display:flex;align-items:center;gap:.8cqw}
.sign{font-weight:700;font-size:1.6cqw;background:var(--line);color:#fff;border:.18cqw solid var(--pencil);border-radius:.6cqw;padding:0 .8cqw;transform:rotate(-2deg);line-height:1.5}
.line-head .tag{margin:0;font-size:1.8cqw}
.klasse{margin-left:auto;font-size:1.3cqw;opacity:.85}
.line{--cy:5.4cqw;display:flex;align-items:flex-start}
.stop{
  --sz:4.2cqw;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;
  padding:calc(var(--cy) - var(--sz) / 2) .2cqw 0;
}
.stop.brk{flex:.6 1 0;--sz:1.8cqw}
.stop.now{--sz:4.4cqw}
.stop.now.brk{--sz:2.6cqw}
.stop::before{
  content:"";position:absolute;left:0;right:0;top:calc(var(--cy) - .4cqw);height:.8cqw;background:var(--line);border-block:.15cqw solid var(--pencil);
}
.stop:first-child::before{left:50%}
.stop:last-child::before{right:50%}
.stop.up::before{background:#fff}
.dot{
  position:relative;z-index:1;width:var(--sz);height:var(--sz);border-radius:50%;font-size:0;
  background:var(--sc,#fff) var(--img) center/cover no-repeat;border:.2cqw solid var(--pencil);box-shadow:0 0 0 .2cqw var(--sc,transparent);
}
.stop.brk .dot{background:#fff;box-shadow:none}
.stop.now .dot{box-shadow:0 0 0 .35cqw var(--w1),0 0 0 .55cqw var(--pencil)}
.stop .nm{font-weight:600;font-size:1.3cqw;line-height:1.1;margin-top:.55cqw;max-width:100%}
.stop .tm{font-weight:400;font-size:1.2cqw;opacity:.85}
.stop.brk .nm{color:var(--blue);font-size:1.15cqw}
.stop.past .dot,.stop.past .nm,.stop.past .tm{opacity:.5}
.here{
  position:absolute;top:0;left:50%;translate:-50% 0;font-weight:600;font-size:1.2cqw;white-space:nowrap;z-index:2;
  background:#fff;color:var(--acc);border:.18cqw solid var(--pencil);border-radius:var(--rad-s);padding:0 .8cqw 0 .4cqw;display:flex;align-items:center;
}
.zug{height:1.8cqw;width:auto;mix-blend-mode:multiply;margin-right:.3cqw}
.here::after{content:"";position:absolute;left:50%;bottom:-.5cqw;margin-left:-.4cqw;width:.7cqw;height:.7cqw;background:#fff;border-right:.18cqw solid var(--pencil);border-bottom:.18cqw solid var(--pencil);transform:rotate(45deg)}
.ok{position:absolute;right:-.3cqw;top:-.3cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--w3);border:.16cqw solid var(--pencil);display:none;place-items:center}
.ok svg{width:70%;height:70%}
.stop.past:not(.brk) .ok{display:grid}

/* ---------- Mutmachspruch ---------- */
.spruch{display:flex;align-items:center;gap:1.6cqw}
.spruch .tag{margin:0;flex:none;max-width:12cqw}
.spruch-text{font-weight:600;font-size:2.5cqw;line-height:1.2;text-wrap:balance;flex:1 1 auto;min-width:0}
.spruch .btn{flex:none}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="wash" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="28"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
</svg>

<div class="stage" id="stage">

  <header class="head">
    <div class="greet-text">
      <h1 id="gruss">Guten Morgen, 4b!</h1>
      <p class="sub">Schön, dass du da bist!</p>
    </div>
    <div class="bubble" id="bubble" aria-hidden="true">Hello!</div>
    <img class="baer" src="img/baer.jpg" alt="" width="560" height="560">
  </header>

  <section class="panel day" aria-label="Datum">
    <span class="tag">Heute ist</span>
    <div class="wd" id="wd">Dienstag</div>
    <div class="date-de tab" id="dateDe">24. November 2026</div>
    <hr class="sep">
    <div class="date-en" id="dateEn">Tuesday, November 24th</div>
  </section>

  <section class="panel now" aria-label="Jetzt und gleich">
    <span class="tag" id="nowTag">Jetzt</span>
    <div class="now-main">
      <div class="bigchip" id="nowChip">Ma</div>
      <div>
        <div class="now-name" id="nowName">Mathe</div>
        <div class="now-time tab" id="nowTime">08:00 – 08:45 Uhr</div>
        <div class="now-left tab" id="nowLeft"></div>
      </div>
    </div>
    <div class="next" id="next"></div>
  </section>

  <section class="panel timer" aria-label="Timer">
    <h2 class="tag">Wir starten in:</h2>
    <div class="clock" id="clock" role="timer" aria-live="off"><span id="cMin">05</span><span class="colon">:</span><span id="cSec">00</span></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="ctl">
      <button class="btn go" id="tGo" type="button">Start</button>
      <button class="btn" id="tReset" type="button">Zurück</button>
    </div>
    <div class="ctl" id="tSet">
      <button class="btn" id="tMinus" type="button" aria-label="Eine Minute weniger">−1</button>
      <button class="btn" id="tPlus" type="button" aria-label="Eine Minute mehr">+1</button>
      <button class="btn preset" data-min="5" type="button">5</button>
      <button class="btn preset" data-min="10" type="button">10</button>
      <button class="btn" id="tTest" type="button" title="Alarmton anhören">Ton testen</button>
    </div>
  </section>

  <section class="panel lineblk" aria-label="Tagesablauf">
    <div class="line-head">
      <span class="sign">4b</span>
      <h2 class="tag">Unser Tag</h2>
      <span class="klasse" id="planInfo">Dienstag</span>
    </div>
    <div class="line" id="line"></div>
  </section>

  <section class="panel spruch" aria-label="Mutmachspruch">
    <h2 class="tag">Mutmach&shy;spruch</h2>
    <p class="spruch-text" id="spruch">Du schaffst das – Schritt für Schritt!</p>
    <button class="btn" id="spruchNeu" type="button">Neuer Spruch</button>
  </section>

</div>

<script>
(function(){
  "use strict";
  document.documentElement.lang='de';
  function pad(n){return n<10?'0'+n:''+n;}
  function $(id){return document.getElementById(id);}
  var TAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  var MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var DAYS_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function ord(n){var v=n%100;if(v>=11&&v<=13)return'th';switch(n%10){case 1:return'st';case 2:return'nd';case 3:return'rd';default:return'th';}}

  /* ---------- Begrüßung, Sprachen, Datum ---------- */
  var HELLO=['Hello!','Merhaba!','Dzień dobry!','Bonjour!','Hola!','Привіт!','مرحبا!','Ciao!'];
  var hi=0;
  setInterval(function(){hi=(hi+1)%HELLO.length;$('bubble').textContent=HELLO[hi];},4000);
  function renderHead(now){
    var h=now.getHours();
    $('gruss').textContent=(h<11?'Guten Morgen':(h<18?'Guten Tag':'Guten Abend'))+', 4b!';
    $('wd').textContent=TAGE[now.getDay()];
    $('dateDe').textContent=now.getDate()+'. '+MONATE[now.getMonth()]+' '+now.getFullYear();
    $('dateEn').textContent=DAYS_EN[now.getDay()]+', '+MONTHS_EN[now.getMonth()]+' '+now.getDate()+ord(now.getDate());
  }

  /* ---------- Mutmachsprüche ---------- */
  var SPRUECHE=[
    'Du schaffst das – Schritt für Schritt!','Fehler sind Freunde des Lernens.','Übung macht dich immer besser.',
    'Du bist mutiger, als du denkst.','Jeder Tag ist eine neue Chance.','Du musst nicht perfekt sein, nur du selbst.',
    'Auch kleine Schritte bringen dich weiter.','Du kannst stolz auf dich sein.','Gemeinsam schaffen wir alles.',
    'Du bist stärker, als du glaubst.','Heute ist ein guter Tag zum Lernen.','Trau dich, Neues auszuprobieren!',
    'Mutig sein heißt, es trotzdem zu versuchen.','Du musst nicht alles auf einmal können.','Dein Bestes ist immer gut genug.',
    'Glaub an dich – wir glauben an dich!','Es ist okay, um Hilfe zu bitten.','Du hast schon so viel geschafft!',
    'Jeder Fehler bringt dich weiter.','Du bist ein wichtiger Teil unserer Klasse.','Bleib dran – du schaffst das!',
    'Du wächst mit jeder Herausforderung.','Trau dich, Fragen zu stellen.','Heute wird ein starker Tag.',
    'Du wirst jeden Tag ein bisschen besser.','Sei stolz auf jeden kleinen Erfolg.','Gemeinsam sind wir stark.',
    'Du machst das großartig!','Heute ist dein Tag – zeig, was in dir steckt!','Du bist klüger, als du denkst.'
  ];
  var sIdx=(function(){var d=new Date();return (d.getFullYear()*366+d.getMonth()*31+d.getDate())%SPRUECHE.length;})();
  function showSpruch(){$('spruch').textContent=SPRUECHE[sIdx];}
  $('spruchNeu').addEventListener('click',function(){
    var n;do{n=Math.floor(Math.random()*SPRUECHE.length);}while(n===sIdx);
    sIdx=n;showSpruch();
  });
  showSpruch();

  /* ---------- Stundenplan als Linie ---------- */
  var SUBJ={
    'Deutsch':{abbr:'De',c:'#F28B82',img:'img/fach-deutsch.jpg'},'Mathe':{abbr:'Ma',c:'#8AB4F0',img:'img/fach-mathe.jpg'},
    'Sachunterricht':{abbr:'Su',c:'#8FD1A0',img:'img/fach-sachunterricht.jpg'},'Musik':{abbr:'Mu',c:'#F7D774',img:'img/fach-musik.jpg'},
    'Kunst':{abbr:'Ku',c:'#C7A6EC',img:'img/fach-kunst.jpg'},'Lebenskunde':{abbr:'Lk',c:'#C3CAD6',img:'img/fach-lebenskunde.jpg'},
    'Sport':{abbr:'Sp',c:'#A9B4CC',img:'img/fach-sport.jpg'},'Englisch':{abbr:'En',c:'#F6B98D',img:'img/fach-englisch.jpg'},
    'Klassenrat':{abbr:'KR',c:'#7CC9A0',img:'img/fach-klassenrat.jpg'}
  };
  var T=[['08:00','08:45'],['09:00','09:45'],['10:10','10:55'],['11:05','11:50'],['12:30','13:15'],['13:25','14:10']];
  var P1='1. Hofpause',P2='Essen / 2. Hofpause';
  function Ls(i,f){return{k:'l',s:T[i][0],e:T[i][1],f:f};}
  var PLAN={
    1:[Ls(0,'Deutsch'),Ls(1,'Lebenskunde'),P1,Ls(2,'Sachunterricht'),Ls(3,'Deutsch'),P2,Ls(4,'Mathe'),Ls(5,'Englisch')],
    2:[Ls(0,'Deutsch'),Ls(1,'Deutsch'),P1,Ls(2,'Musik'),Ls(3,'Englisch'),P2,Ls(4,'Sachunterricht'),Ls(5,'Mathe')],
    3:[Ls(0,'Deutsch'),Ls(1,'Sport'),P1,Ls(2,'Mathe'),Ls(3,'Deutsch'),P2,Ls(4,'Sachunterricht'),Ls(5,'Sachunterricht')],
    4:[Ls(0,'Sport'),Ls(1,'Musik'),P1,Ls(2,'Kunst'),Ls(3,'Kunst'),P2,Ls(4,'Mathe'),Ls(5,'Englisch')],
    5:[Ls(0,'Deutsch'),Ls(1,'Sachunterricht'),P1,Ls(2,'Sport'),Ls(3,'Mathe'),P2,Ls(4,'Klassenrat')]
  };
  function mins(hhmm){var p=hhmm.split(':');return +p[0]*60+ +p[1];}
  function timeline(day){
    var src=PLAN[day],out=[],i;
    for(i=0;i<src.length;i++){
      var it=src[i];
      if(typeof it==='string'){out.push({k:'b',name:it,s:src[i-1].e,e:src[i+1].s});}
      else{out.push(it);}
    }
    return out;
  }
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#1B2744" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 6.5"/></svg>';
  var HERE='<span class="here"><img class="zug" src="img/zug.jpg" alt="">Du bist hier</span>';
  var lastKey='';
  function render(now){
    var day=now.getDay(),weekend=false;
    if(day===0||day===6){day=1;weekend=true;}
    var tl=timeline(day),nowM=now.getHours()*60+now.getMinutes();
    var cur=-1,i;
    if(!weekend){
      for(i=0;i<tl.length;i++){if(nowM>=mins(tl[i].s)&&nowM<mins(tl[i].e)){cur=i;break;}}
    }
    var before=!weekend&&cur<0&&nowM<mins(tl[0].s);
    var after=!weekend&&cur<0&&nowM>=mins(tl[tl.length-1].e);
    var key=day+'|'+weekend+'|'+cur+'|'+before+'|'+after,html='';
    if(key!==lastKey){
      lastKey=key;
      for(i=0;i<tl.length;i++){
        var it=tl[i];
        var st=weekend?'up':(cur===i?'now':((cur>i||after||(cur<0&&!before&&nowM>=mins(it.e)))?'past':'up'));
        if(it.k==='b'){
          html+='<div class="stop brk '+st+'">'+(st==='now'?HERE:'')+'<span class="dot"></span><span class="nm">'+it.name+'</span></div>';
        }else{
          var sj=SUBJ[it.f];
          html+='<div class="stop '+st+'" style="--sc:'+sj.c+';--img:url('+sj.img+')">'+(st==='now'?HERE:'')+'<span class="dot">'+sj.abbr+'<span class="ok">'+CHECK+'</span></span><span class="nm">'+it.f+'</span><span class="tm tab">'+it.s+'</span></div>';
        }
      }
      $('line').innerHTML=html;
    }
    $('planInfo').textContent=weekend?'Vorschau Montag':TAGE[now.getDay()];

    var chip=$('nowChip'),nm=$('nowName'),tm=$('nowTime'),lf=$('nowLeft'),tag=$('nowTag');
    var nextLesson=null,startAt=cur+1;
    if(cur<0&&before){startAt=0;}
    if(weekend){startAt=0;}
    if(!after){for(i=Math.max(0,startAt);i<tl.length;i++){if(tl[i].k==='l'){nextLesson=tl[i];break;}}}
    chip.style.display='';chip.style.backgroundImage='';lf.textContent='';
    if(weekend){
      tag.textContent='Jetzt';chip.style.display='none';nm.textContent='Wochenende!';tm.textContent='Am Montag geht es weiter.';
    }else if(after){
      tag.textContent='Jetzt';chip.style.display='none';nm.textContent='Schulschluss!';tm.textContent='Schönen Nachmittag.';
    }else if(before){
      tag.textContent='Gleich';chip.style.display='none';nm.textContent='Ankommen';tm.textContent='Der Unterricht beginnt um '+tl[0].s+' Uhr.';
    }else if(tl[cur].k==='b'){
      tag.textContent='Jetzt';chip.style.display='none';nm.textContent='Pause';tm.textContent=tl[cur].name+' · bis '+tl[cur].e+' Uhr';
      lf.textContent='noch '+(mins(tl[cur].e)-nowM)+' Min';
    }else{
      var c=tl[cur],sj2=SUBJ[c.f];
      tag.textContent='Jetzt';chip.textContent=sj2.abbr;chip.style.setProperty('--sc',sj2.c);chip.style.backgroundImage='url('+sj2.img+')';
      nm.textContent=c.f;tm.textContent=c.s+' – '+c.e+' Uhr';lf.textContent='noch '+(mins(c.e)-nowM)+' Min';
    }
    var nx=$('next');
    if(nextLesson){
      var sj3=SUBJ[nextLesson.f];
      nx.innerHTML='<span>Gleich:</span><span class="chip" style="--sc:'+sj3.c+';--img:url('+sj3.img+')">'+sj3.abbr+'</span><span>'+nextLesson.f+'<br><small class="tab">'+nextLesson.s+' Uhr</small></span>';
      nx.style.display='';
    }else{nx.style.display='none';}
  }

  /* ---------- Timer mit lautem Ton ---------- */
  var setSec=300,remain=300,running=false,endAt=0,iv=null,ctx=null;
  var clock=$('clock'),cMin=$('cMin'),cSec=$('cSec'),bar=$('bar'),goBtn=$('tGo'),setRow=$('tSet');
  function showTimer(){
    var s=Math.max(0,Math.ceil(remain));
    cMin.textContent=pad(Math.floor(s/60));cSec.textContent=pad(s%60);
    bar.style.width=(setSec>0?Math.max(0,remain/setSec)*100:0)+'%';
    clock.classList.toggle('warn',running&&s<=10&&s>0);
  }
  function enableSet(on){var b=setRow.querySelectorAll('button:not(#tTest)');for(var i=0;i<b.length;i++)b[i].disabled=!on;}
  function audio(){
    if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function beep(c,t,f,d,g,type){
    var o=c.createOscillator(),a=c.createGain();
    o.type=type;o.frequency.value=f;
    a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g,t+0.01);
    a.gain.setValueAtTime(g,t+d-0.04);a.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(a);a.connect(c.destination);o.start(t);o.stop(t+d+0.02);
  }
  /* Schulglocken-Alarm: sechsmal Doppelton, volle Lautstärke, ca. 4 Sekunden */
  function alarm(){
    var c=audio();if(!c)return;
    var t=c.currentTime+0.05;
    for(var i=0;i<6;i++){
      beep(c,t+i*0.65,988,0.28,0.9,'square');
      beep(c,t+i*0.65+0.3,784,0.28,0.9,'square');
      beep(c,t+i*0.65,1976,0.28,0.25,'sine');
    }
  }
  function finish(){
    clearInterval(iv);iv=null;running=false;remain=0;showTimer();
    clock.classList.add('done');goBtn.textContent='Nochmal';enableSet(true);goBtn.dataset.state='done';
    alarm();
  }
  function tick(){
    remain=(endAt-Date.now())/1000;
    if(remain<=0){finish();return;}
    showTimer();
  }
  function resetClock(){clock.classList.remove('done','warn');goBtn.dataset.state='';}
  goBtn.addEventListener('click',function(){
    audio();
    if(goBtn.dataset.state==='done'){remain=setSec;resetClock();showTimer();}
    if(running){clearInterval(iv);iv=null;running=false;goBtn.textContent='Weiter';enableSet(false);showTimer();return;}
    if(remain<=0)return;
    running=true;endAt=Date.now()+remain*1000;goBtn.textContent='Pause';enableSet(false);
    iv=setInterval(tick,200);tick();
  });
  $('tReset').addEventListener('click',function(){
    clearInterval(iv);iv=null;running=false;remain=setSec;resetClock();goBtn.textContent='Start';enableSet(true);showTimer();
  });
  $('tTest').addEventListener('click',alarm);
  function setMin(m){
    if(running)return;
    m=Math.max(1,Math.min(99,m));setSec=m*60;remain=setSec;resetClock();goBtn.textContent='Start';showTimer();
  }
  $('tPlus').addEventListener('click',function(){setMin(Math.round(setSec/60)+1);});
  $('tMinus').addEventListener('click',function(){setMin(Math.round(setSec/60)-1);});
  var pre=document.querySelectorAll('.preset');
  for(var i=0;i<pre.length;i++){pre[i].addEventListener('click',function(){setMin(+this.getAttribute('data-min'));});}
  showTimer();

  function loop(){var n=new Date();renderHead(n);render(n);}
  loop();setInterval(loop,1000);
})();
</script>
