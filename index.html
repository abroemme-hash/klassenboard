<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Klassen-Tagesboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600;700&family=Kaushan+Script&display=swap');

  :root{
    --bg:#FBF6EA;
    --bg-alt:#F3ECDA;
    --surface:#FFFFFF;
    --surface-2:#FFFDF8;
    --ink:#213B5C;
    --ink-soft:#5A6C85;
    --blue:#3E7CC2;
    --blue-deep:#2C5C94;
    --green:#2F5B3E;
    --green-deep:#1E3F2A;
    --green-ink:#EAF3EA;
    --yellow:#F0BF3B;
    --yellow-deep:#C99416;
    --pink:#E8749A;
    --pink-deep:#C85578;
    --border:#E1D6BA;
    --shadow:rgba(33,59,92,.14);
    --ring:rgba(240,191,59,.55);
    --accent-bg:#E4F0FC;
    --accent-border:#BEDBF5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1A2B;
      --bg-alt:#15223A;
      --surface:#1A2A44;
      --surface-2:#1F3150;
      --ink:#F1ECDC;
      --ink-soft:#B9C6DC;
      --blue:#79ABE6;
      --blue-deep:#5892D3;
      --green:#5B9A73;
      --green-deep:#173726;
      --green-ink:#E6F2E9;
      --yellow:#F3C94E;
      --yellow-deep:#D9A824;
      --pink:#F0A0BC;
      --pink-deep:#E8749A;
      --border:#2C3E5E;
      --shadow:rgba(0,0,0,.45);
      --ring:rgba(243,201,78,.45);
      --accent-bg:#17293F;
      --accent-border:#2C4A6E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1A2B;
    --bg-alt:#15223A;
    --surface:#1A2A44;
    --surface-2:#1F3150;
    --ink:#F1ECDC;
    --ink-soft:#B9C6DC;
    --blue:#79ABE6;
    --blue-deep:#5892D3;
    --green:#5B9A73;
    --green-deep:#173726;
    --green-ink:#E6F2E9;
    --yellow:#F3C94E;
    --yellow-deep:#D9A824;
    --pink:#F0A0BC;
    --pink-deep:#E8749A;
    --border:#2C3E5E;
    --shadow:rgba(0,0,0,.45);
    --ring:rgba(243,201,78,.45);
    --accent-bg:#17293F;
    --accent-border:#2C4A6E;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    font-size:17px;
    padding-inline:0;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  .hand{
    font-family:'Caveat',cursive;
  }
  .wrap{
    max-width:1180px;
    margin-inline:auto;
    padding-inline:16px;
  }
  @media (min-width:1500px){
    .wrap{ max-width:min(96vw,1900px); }
  }
  @media (min-width:2000px){
    .wrap{ max-width:min(94vw,2600px); }
  }
  button{font-family:inherit;}
  .tabular{font-variant-numeric:tabular-nums;}


  /* ---------- GREETING BAR (below hero image) ---------- */
  .greetbar{
    background:var(--surface) url('greetbar_bg.jpg') center center / cover no-repeat;
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 14px var(--shadow);
  }
  .greetbar-inner{
    max-width:1180px;
    margin-inline:auto;
    padding:16px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:nowrap;
  }
  @media (min-width:1500px){
    .greetbar-inner{ max-width:min(96vw,1900px); }
  }
  @media (min-width:2000px){
    .greetbar-inner{ max-width:min(94vw,2600px); }
  }
  @media (max-width:1499px){
    .greetbar-inner{flex-wrap:wrap;}
    .hero-dates{text-align:left; width:100%;}
  }
  .hero-greet{min-width:0;flex:1 1 auto;text-align:left;}
  .pre-greet{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(1.3rem,4.4vw,2.3rem);
    color:var(--blue-deep);
    margin:0 0 2px;
    line-height:1.1;
  }
  .hero-greet h1{
    font-size:clamp(1.4rem,4.4vw,2.3rem);
    color:#D64545;
  }
  .hero-dates{
    text-align:right;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:28px;
    padding:28px 40px;
    flex:none;
  }
  .hero-dates .row{
    font-size:clamp(3.2rem,6.8vw,4.4rem);
    color:var(--ink);
    white-space:nowrap;
  }
  .hero-dates .row.en{
    font-size:clamp(1.6rem,3.4vw,2.2rem);
  }
  .hero-dates .row .label{
    font-weight:800;
    color:var(--blue-deep);
  }
  .hero-dates .row.en .label{
    color:var(--pink-deep);
  }
  .ordinal{
    font-size:.6em;
    color:#D64545;
    font-weight:800;
    vertical-align:baseline;
  }

  /* ---------- MAIN GRID ---------- */
  main{padding-block:22px 28px;}
  .grid{
    display:grid;
    grid-template-columns:1.15fr 1.05fr auto;
    row-gap:18px;
    column-gap:8px;
    align-items:start;
  }
  @media (max-width:860px){
    .grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 8px 24px var(--shadow);
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px;
  }
  .panel-head h2{
    font-size:1.5rem;
    color:inherit;
  }
  .panel-head .icon{width:24px;height:24px;flex:none;}
  .panel-body{padding:0 16px 16px;}

  /* Timer ("Wir starten in") */
  .timer-box{
    background:transparent;
    border:3px solid #D64545;
    border-radius:20px;
    box-shadow:none;
    padding:12px 16px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
  }
  .timer-title{
    font-size:2.6rem;
    color:#D64545;
  }
  .timer-display{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .timer-display.timer-danger .digit-value{
    color:#D64545;
  }
  .digit-group{display:flex;gap:4px;}
  .digit-stepper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .digit-arrow{
    appearance:none;-webkit-appearance:none;
    background:transparent;border:none;
    padding:12px;
    min-width:44px;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--blue-deep);
    line-height:0;
    border-radius:10px;
  }
  .digit-arrow:hover{background:var(--bg-alt);}
  .digit-arrow:active{background:var(--accent-bg);}
  .digit-arrow:disabled{
    opacity:.3;
    cursor:default;
    background:transparent;
  }
  .digit-arrow svg{width:26px;height:26px;}
  .digit-value{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:clamp(2.1rem,4.6vw,2.8rem);
    line-height:1;
    color:var(--ink);
    background:transparent;
    border:none;
    min-width:1.05em;
    text-align:center;
    padding:6px 4px;
  }
  .timer-colon{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-size:clamp(2.1rem,4.6vw,2.8rem);
    color:var(--ink-soft);
    align-self:center;
    padding-bottom:20px;
  }
  .timer-actions{display:flex;gap:10px;}

  .col-stack{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-self:start;
  }
  .accent-panel{
    background:var(--accent-bg);
    border-color:var(--accent-border);
    min-height:120px;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    margin-top:16px;
  }
  .accent-panel .panel-head .icon{color:var(--blue-deep);}
  .accent-panel .panel-head h2{color:#D64545;}
  .daily-pick-text{
    font-family:'Nunito',system-ui,sans-serif;
    font-weight:700;
    font-size:calc(1.55rem + 3pt);
    line-height:1.5;
    color:var(--ink);
    margin:0;
  }

  /* Was ist heute wichtig */
  .triple-exclaim{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:800;
    font-size:1.5rem;
    color:#D64545;
    line-height:1;
    letter-spacing:1px;
    flex:none;
  }
  .picker-panel{min-height:399px;display:flex;flex-direction:column;}
  .picker-panel .panel-body{min-height:1px;flex:1;display:flex;}
  .daily-notes{
    flex:1;
    width:100%;
    min-height:280px;
    border:none;
    background:transparent;
    resize:none;
    outline:none;
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(1.8rem,3.6vw,2.6rem);
    line-height:1.4;
    color:var(--ink);
    padding:2px 4px;
  }
  .daily-notes::placeholder{
    color:var(--ink);
    opacity:.45;
  }
  .btn{
    appearance:none;border:none;border-radius:999px;
    padding:10px 18px;
    font-weight:800;font-size:1.15rem;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px;}
  .btn-primary{background:var(--pink-deep);color:#fff;box-shadow:0 4px 12px rgba(200,85,120,.35);}
  .btn-primary:hover{background:var(--pink);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--ink);}

  .logo-panel{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .logo-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    flex:none;
    border-radius:10px;
    transition:transform .15s ease;
  }
  .logo-link:hover,
  .logo-link:focus-visible{
    transform:scale(1.08);
  }
  .logo-link img{
    max-width:44px;
    max-height:44px;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  }

  /* Tagesplan */
  .tagesplan-panel{
    text-align:right;
    background:transparent;
    border:none;
    box-shadow:none;
    overflow:visible;
    margin-left:10px;
    --tp-scale:1;
    --tp-wscale:1;
  }
  .tagesplan-panel .panel-head{
    justify-content:flex-end;
  }
  .tagesplan-panel .panel-head h2{
    font-size:2.3rem;
    color:#D64545;
  }
  .tagesplan-body{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:calc(10px * var(--tp-scale));
  }
  .lesson-slot{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
  }
  .lesson-sub-input{
    width:375px;
    height:40px;
    border:none;
    background:transparent;
    outline:none;
    text-align:right;
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:700;
    font-size:1.8rem;
    color:var(--ink);
    padding:0 4px;
    flex:none;
  }
  .lesson-sub-input::placeholder{
    color:var(--ink-soft);
    opacity:.4;
  }
  .lesson-sub-input:focus{
    outline:2px solid var(--ring);
    outline-offset:1px;
    border-radius:6px;
    background:rgba(255,255,255,.5);
  }
  .lesson-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
  }
  .lesson-box{
    width:calc(206.25px * var(--tp-wscale));height:calc(82.5px * var(--tp-scale));
    border-radius:calc(20px * var(--tp-wscale));
    border:calc(3.75px * var(--tp-wscale)) solid var(--border);
    background:var(--surface);
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:calc(12.5px * var(--tp-wscale));
    padding:calc(5px * var(--tp-scale)) calc(15px * var(--tp-wscale)) calc(5px * var(--tp-scale)) calc(5px * var(--tp-wscale));
    position:relative;
    flex:none;
    overflow:visible;
    cursor:pointer;
    box-shadow:0 5px 14px var(--shadow);
    transition:box-shadow .2s ease, transform .12s ease;
  }
  .lesson-box:hover{
    box-shadow:0 6px 18px var(--shadow);
    transform:translateY(-1px);
  }
  .lesson-box:active{
    transform:translateY(0);
  }
  .lesson-box:focus-visible{
    outline:3px solid var(--ring);
    outline-offset:2px;
  }
  .lesson-img{
    width:calc(60px * var(--tp-wscale));
    height:calc(60px * var(--tp-wscale));
    flex:none;
    object-fit:contain;
  }
  .lesson-img-empty{
    width:calc(60px * var(--tp-wscale));
    height:calc(60px * var(--tp-wscale));
    flex:none;
  }
  .lesson-edit-hint{
    position:absolute;
    bottom:calc(-10px * var(--tp-wscale));left:calc(-10px * var(--tp-wscale));
    width:calc(25px * var(--tp-wscale));height:calc(25px * var(--tp-wscale));
    border-radius:50%;
    background:var(--surface);
    border:1.5px solid var(--border);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .lesson-edit-hint svg{width:calc(13.75px * var(--tp-wscale));height:calc(13.75px * var(--tp-wscale));}
  .lesson-abbr{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:800;
    font-size:calc(2.625rem * var(--tp-wscale));
    line-height:1;
    color:#000;
  }
  .lesson-row.current .lesson-box{
    box-shadow:0 0 0 3px var(--ring), 0 4px 12px var(--shadow);
  }
  .lesson-row.past .lesson-box{
    opacity:.55;
  }
  .lesson-check{
    position:absolute;
    top:calc(-17.5px * var(--tp-wscale));right:calc(-17.5px * var(--tp-wscale));
    width:calc(46.25px * var(--tp-wscale));height:calc(46.25px * var(--tp-wscale));
    border-radius:50%;
    background:#2F9E5C;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
    z-index:5;
  }
  .lesson-check svg{width:calc(27.5px * var(--tp-wscale));height:calc(27.5px * var(--tp-wscale));stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
  .lesson-break{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:700;
    font-size:calc(1.625rem * var(--tp-wscale));
    color:#1B3A6B;
    padding:calc(2.5px * var(--tp-scale)) 2.5px;
  }
  .tagesplan-empty{
    font-size:1.2rem;
    color:var(--ink-soft);
  }

  /* Settings drawer */
  .drawer{
    position:fixed; inset:0;
    background:rgba(15,26,43,.55);
    display:flex; align-items:flex-end; justify-content:center;
    padding:16px;
    z-index:20;
  }
  .drawer-card{
    background:var(--surface);
    border-radius:20px 20px 12px 12px;
    max-width:520px;width:100%;
    max-height:min(80vh,640px);
    overflow-y:auto;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .drawer-card h3{font-size:1.4rem;margin-bottom:4px;}
  .drawer-card p.hint{color:var(--ink-soft);font-size:1.05rem;margin:4px 0 8px;}
  .drawer-card label{display:block;font-weight:700;font-size:1.05rem;margin:14px 0 6px;}
  .drawer-card textarea{
    width:100%;min-height:96px;
    border-radius:12px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--ink);
    padding:10px 12px;font-family:'Nunito',sans-serif;font-size:1.1rem;
    resize:vertical;
  }
  .drawer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

  .subject-picker-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:10px;
    margin-top:4px;
  }
  .subject-picker-btn{
    appearance:none;
    background:var(--surface-2);
    border:2.5px solid var(--border);
    border-radius:14px;
    padding:10px 6px 8px;
    min-height:76px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .subject-picker-btn:hover{
    box-shadow:0 4px 12px var(--shadow);
    transform:translateY(-1px);
  }
  .subject-picker-btn:active{transform:translateY(0);}
  .subject-picker-btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px;}
  .subject-picker-btn img{width:32px;height:32px;flex:none;object-fit:contain;}
  .subject-picker-dot{
    width:24px;height:24px;
    border-radius:50%;
    flex:none;
  }
  .subject-picker-btn span:last-child{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:800;
    font-size:1.2rem;
    color:var(--ink);
  }

  /* ---------- Große Bildschirme (Klassenraum-Board) ---------- */
  @media (min-width:1500px){
    body{ font-size:1.4rem; }
    .panel-head h2{ font-size:1.9rem; }
    .panel-head .icon{ width:34px; height:34px; }
    .timer-title{ font-size:3.1rem; }
    .digit-value{ font-size:clamp(2.8rem,3.8vw,3.8rem); }
    .timer-colon{ font-size:clamp(2.8rem,3.8vw,3.8rem); }
    .digit-arrow{ min-width:56px; min-height:56px; padding:14px; }
    .digit-arrow svg{ width:32px; height:32px; }
    .daily-pick-text{ font-size:calc(1.85rem + 3pt); }
    .triple-exclaim{ font-size:1.8rem; }
    .daily-notes{ font-size:clamp(2rem,2.8vw,2.9rem); }
    .logo-link{ width:64px; height:64px; }
    .logo-link img{ max-width:64px; max-height:64px; }
    .pre-greet{ font-size:clamp(1.8rem,3vw,2.9rem); }
    .hero-greet h1{ font-size:clamp(1.7rem,3vw,2.8rem); }
    .hero-dates .row{ font-size:clamp(3.8rem,4.8vw,5.2rem); }
    .hero-dates .row.en{ font-size:clamp(1.9rem,2.4vw,2.6rem); }
    .lesson-box{ width:calc(256.25px * var(--tp-wscale)); height:calc(102.5px * var(--tp-scale)); border-radius:calc(22.5px * var(--tp-wscale)); padding:calc(6.25px * var(--tp-scale)) calc(23.75px * var(--tp-wscale)) calc(6.25px * var(--tp-scale)) calc(6.25px * var(--tp-wscale)); gap:calc(16.25px * var(--tp-wscale)); }
    .lesson-img{ width:calc(75px * var(--tp-wscale)); height:calc(75px * var(--tp-wscale)); }
    .lesson-abbr{ font-size:calc(3.125rem * var(--tp-wscale)); }
    .lesson-break{ font-size:calc(2rem * var(--tp-wscale)); }
    .lesson-sub-input{ width:445px; height:48px; font-size:2.1rem; }
    .tagesplan-panel .panel-head h2{ font-size:3.1rem; }
    .btn{ font-size:1.3rem; padding:12px 22px; }
    .drawer-card h3{ font-size:1.7rem; }
    .drawer-card p.hint{ font-size:1.2rem; }
    .drawer-card label{ font-size:1.2rem; }
    .drawer-card textarea{ font-size:1.25rem; }
    .tagesplan-empty{ font-size:1.4rem; }
    .subject-picker-btn{ min-height:96px; padding:14px 8px 10px; }
    .subject-picker-btn img{ width:42px; height:42px; }
    .subject-picker-dot{ width:30px; height:30px; }
    .subject-picker-btn span:last-child{ font-size:1.4rem; }
  }

  [hidden]{display:none!important;}
</style>

<div class="greetbar">

    switch(n % 10){
      case 1: return 'st';
      case 2: return 'nd';
      case 3: return 'rd';
      default: return 'th';
    }
  }

    var deStr = pad(d)+'.'+pad(mo+1)+'.'+y;
    dateDeEl.textContent = deStr;

    dateEnEl.innerHTML = d + '<span class="ordinal">' + ordinalSuffix(d) + '</span> ' + EN_MONTHS[mo] + ' ' + y;

    renderTagesplan(now);
  }

  /* ---------- Timer ---------- */
  var timerDigits = {hT:0, hO:0, mT:0, mO:0, sT:0, sO:0};
  var timerDisplay = document.getElementById('timerDisplay');
  var timerStartBtn = document.getElementById('timerStart');
  var timerResetBtn = document.getElementById('timerReset');
  var timerArrows = Array.prototype.slice.call(document.querySelectorAll('.digit-arrow'));
  var timerRunning = false;
  var timerRemaining = 0;
  var timerIntervalId = null;
  var audioCtx = null;

  function renderTimerDigits(){
    Object.keys(timerDigits).forEach(function(key){
      document.getElementById('digit-'+key).textContent = timerDigits[key];
    });
  }

  function setArrowsDisabled(disabled){
    timerArrows.forEach(function(btn){ btn.disabled = disabled; });
  }

  timerArrows.forEach(function(btn){
    btn.addEventListener('click', function(){
      if(timerRunning) return;
      var key = btn.dataset.digit;
      var dir = parseInt(btn.dataset.dir, 10);
      timerDigits[key] = (timerDigits[key] + dir + 10) % 10;
      renderTimerDigits();
    });
  });

  function digitsToSeconds(){
    var h = timerDigits.hT * 10 + timerDigits.hO;
    var m = timerDigits.mT * 10 + timerDigits.mO;
    var s = timerDigits.sT * 10 + timerDigits.sO;
    return h * 3600 + m * 60 + s;
  }

  function secondsToDigits(total){
    if(total < 0) total = 0;
    var h = Math.floor(total / 3600) % 100;
    var rem = total % 3600;
    var m = Math.floor(rem / 60);
    var s = rem % 60;
    timerDigits.hT = Math.floor(h / 10) % 10;
    timerDigits.hO = h % 10;
    timerDigits.mT = Math.floor(m / 10) % 10;
    timerDigits.mO = m % 10;
    timerDigits.sT = Math.floor(s / 10) % 10;
    timerDigits.sO = s % 10;
    renderTimerDigits();
  }

  function getAudioCtx(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playTone(ctx, freq, startTime, duration, peakGain){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function playChime(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var now = ctx.currentTime;
    // Aufsteigender Dreiklang, dann gemeinsamer Ausklang – freundlich, aber gut hörbar
    playTone(ctx, 523.25, now,        0.5, 0.22); // C5
    playTone(ctx, 659.25, now + 0.18, 0.5, 0.22); // E5
    playTone(ctx, 783.99, now + 0.36, 0.7, 0.22); // G5
    playTone(ctx, 523.25, now + 0.62, 0.9, 0.16);
    playTone(ctx, 659.25, now + 0.62, 0.9, 0.16);
    playTone(ctx, 783.99, now + 0.62, 0.9, 0.16);
  }

  function updateTimerDanger(){
    if(timerRemaining <= 60 && timerRemaining > 0){
      timerDisplay.classList.add('timer-danger');
    }else if(timerRemaining === 0){
      timerDisplay.classList.add('timer-danger');
    }else{
      timerDisplay.classList.remove('timer-danger');
    }
  }

  function timerTick(){
    timerRemaining--;
    if(timerRemaining <= 0){
      timerRemaining = 0;
      secondsToDigits(0);
      updateTimerDanger();
      clearInterval(timerIntervalId);
      timerIntervalId = null;
      timerRunning = false;
      setArrowsDisabled(false);
      timerStartBtn.disabled = false;
      timerStartBtn.textContent = '';
      timerStartBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start';
      playChime();
      return;
    }
    secondsToDigits(timerRemaining);
    updateTimerDanger();
  }

  timerStartBtn.addEventListener('click', function(){
    if(timerRunning) return;
    getAudioCtx(); // Audio früh freigeben (Nutzergeste)
    var total = digitsToSeconds();
    if(total <= 0) return;
    timerRemaining = total;
    timerRunning = true;
    setArrowsDisabled(true);
    timerStartBtn.disabled = true;
    timerStartBtn.textContent = 'Läuft …';
    updateTimerDanger();
    timerIntervalId = setInterval(timerTick, 1000);
  });

  timerResetBtn.addEventListener('click', function(){
    if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
    timerRunning = false;
    timerRemaining = 0;
    timerDigits = {hT:0, hO:0, mT:0, mO:0, sT:0, sO:0};
    renderTimerDigits();
    timerDisplay.classList.remove('timer-danger');
    setArrowsDisabled(false);
    timerStartBtn.disabled = false;
    timerStartBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start';
  });

  /* ---------- Tagesplan ---------- */
  var LESSON_CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="4,13 10,19 20,6"/></svg>';

  var SUBJECTS = {
    'Deutsch':        { abbr:'De', color:'#D6323C', img:'lesson_deutsch.png' },
    'Mathe':          { abbr:'Ma', color:'#2C5C94', img:'lesson_mathe.png' },
    'Sachunterricht': { abbr:'Su', color:'#2F8F46', img:'lesson_sachunterricht.png' },
    'Musik':          { abbr:'Mu', color:'#E0B400', img:'lesson_musik.png' },
    'Kunst':          { abbr:'Ku', color:'#8B5FBF', img:'lesson_kunst.png' },
    'Lebenskunde':    { abbr:'Lk', color:'#5A5A5A', img:'lesson_lebenskunde.png' },
    'Sport':          { abbr:'Sp', color:'#222222', img:'lesson_sport.png' },
    'Englisch':       { abbr:'En', color:'#E8791A', img:'lesson_englisch.png' },
    'Computerraum':   { abbr:'PC', color:'#B8B8B8', img:'' },
    'Klassenrat':     { abbr:'KR', color:'#1E5B2E', img:'lesson_klassenrat.jpg' }
  };

  // Stundenplan Klasse 4b, gültig ab 31.08.2026 (aus dem Original-PDF übernommen)
  var STUNDENPLAN = {
    1: [ // Montag
      { start:'08:00', end:'08:45', subject:'Deutsch' },
      { start:'09:00', end:'09:45', subject:'Lebenskunde' },
      { brk:'1. Hofpause' },
      { start:'10:10', end:'10:55', subject:'Sachunterricht' },
      { start:'11:05', end:'11:50', subject:'Deutsch' },
      { brk:'Essen / 2. Hofpause' },
      { start:'12:30', end:'13:15', subject:'Mathe' },
      { start:'13:25', end:'14:10', subject:'Englisch' }
    ],
    2: [ // Dienstag
      { start:'08:00', end:'08:45', subject:'Deutsch' },
      { start:'09:00', end:'09:45', subject:'Deutsch' },
      { brk:'1. Hofpause' },
      { start:'10:10', end:'10:55', subject:'Musik' },
      { start:'11:05', end:'11:50', subject:'Englisch' },
      { brk:'Essen / 2. Hofpause' },
      { start:'12:30', end:'13:15', subject:'Sachunterricht' },
      { start:'13:25', end:'14:10', subject:'Mathe' }
    ],
    3: [ // Mittwoch
      { start:'08:00', end:'08:45', subject:'Deutsch' },
      { start:'09:00', end:'09:45', subject:'Sport' },
      { brk:'1. Hofpause' },
      { start:'10:10', end:'10:55', subject:'Mathe' },
      { start:'11:05', end:'11:50', subject:'Deutsch' },
      { brk:'Essen / 2. Hofpause' },
      { start:'12:30', end:'13:15', subject:'Sachunterricht' },
      { start:'13:25', end:'14:10', subject:'Sachunterricht' }
    ],
    4: [ // Donnerstag
      { start:'08:00', end:'08:45', subject:'Sport' },
      { start:'09:00', end:'09:45', subject:'Musik' },
      { brk:'1. Hofpause' },
      { start:'10:10', end:'10:55', subject:'Kunst' },
      { start:'11:05', end:'11:50', subject:'Kunst' },
      { brk:'Essen / 2. Hofpause' },
      { start:'12:30', end:'13:15', subject:'Mathe' },
      { start:'13:25', end:'14:10', subject:'Englisch' }
    ],
    5: [ // Freitag
      { start:'08:00', end:'08:45', subject:'Deutsch' },
      { start:'09:00', end:'09:45', subject:'Sachunterricht' },
      { brk:'1. Hofpause' },
      { start:'10:10', end:'10:55', subject:'Sport' },
      { start:'11:05', end:'11:50', subject:'Mathe' },
      { brk:'Essen / 2. Hofpause' },
      { start:'12:30', end:'13:15', subject:'Klassenrat' }
    ]
  };

  var tagesplanBody = document.getElementById('tagesplanBody');

  function timeToDate(base, hhmm){
    var parts = hhmm.split(':');
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    return d;
  }

  var lessonOverrides = {}; // key "jsDay_idx" -> Fachname (Überschreibung nur für die aktuelle Sitzung)
  var activeOverrideKey = null;

  var substituteTeachers = {}; // key "jsDay_idx" -> eingetragener Vertretungslehrer (nur aktuelle Sitzung)

  function escapeAttr(str){
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderTagesplan(now){
    if(!tagesplanBody) return;
    // Während gerade in ein Vertretungsfeld getippt wird, nicht neu rendern (sonst geht der Fokus verloren)
    var active = document.activeElement;
    if(active && active.classList && active.classList.contains('lesson-sub-input')){
      return;
    }
    var jsDay = now.getDay(); // 0=So … 6=Sa
    var plan = STUNDENPLAN[jsDay];
    if(!plan){
      tagesplanBody.innerHTML = '<p class="tagesplan-empty">Heute kein Unterricht.</p>';
      return;
    }
    var html = '';
    plan.forEach(function(item, idx){
      if(item.brk){
        html += '<div class="lesson-break">'+item.brk+'</div>';
        return;
      }
      var key = jsDay+'_'+idx;
      var subjectName = lessonOverrides[key] || item.subject;
      var subj = SUBJECTS[subjectName] || { abbr:'?', color:'#999', img:'' };
      var startD = timeToDate(now, item.start);
      var endD = timeToDate(now, item.end);
      var state = 'upcoming';
      if(now >= endD){ state = 'past'; }
      else if(now >= startD && now < endD){ state = 'current'; }
      var subValue = substituteTeachers[key] || '';
      html += '<div class="lesson-slot">'
        + '<input type="text" class="lesson-sub-input" placeholder="" data-key="'+key+'" value="'+escapeAttr(subValue)+'" />'
        + '<div class="lesson-row '+state+'">'
        + '<div class="lesson-box" data-key="'+key+'" tabindex="0" role="button" aria-label="Fach ändern" style="border-color:'+subj.color+';color:'+subj.color+';">'
        + (subj.img ? '<img class="lesson-img" src="'+subj.img+'" alt="'+subjectName+'" />' : '<span class="lesson-img lesson-img-empty"></span>')
        + '<span class="lesson-abbr">'+subj.abbr+'</span>'
        + '<span class="lesson-edit-hint">'+EDIT_HINT_SVG+'</span>'
        + (state==='past' ? '<span class="lesson-check">'+LESSON_CHECK_SVG+'</span>' : '')
        + '</div>'
        + '</div>'
        + '</div>';
    });
    tagesplanBody.innerHTML = html;
  }

  /* ---------- Fach tauschen ---------- */
  var EDIT_HINT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5 19.5 9.5 8 21H3v-5Z"/></svg>';

  var subjectDrawer = document.getElementById('subjectDrawer');
  var subjectPickerGrid = document.getElementById('subjectPickerGrid');
  var subjectResetBtn = document.getElementById('subjectResetBtn');
  var subjectCancelBtn = document.getElementById('subjectCancelBtn');

  function openSubjectPicker(key){
    activeOverrideKey = key;
    if(!subjectPickerGrid) return;
    var buttons = '';
    Object.keys(SUBJECTS).forEach(function(name){
      var s = SUBJECTS[name];
      buttons += '<button type="button" class="subject-picker-btn" data-subject="'+name+'" style="border-color:'+s.color+';">'
        + (s.img ? '<img src="'+s.img+'" alt="" />' : '<span class="subject-picker-dot" style="background:'+s.color+';"></span>')
        + '<span>'+s.abbr+'</span>'
        + '</button>';
    });
    subjectPickerGrid.innerHTML = buttons;
    if(subjectDrawer){ subjectDrawer.hidden = false; }
  }

  function closeSubjectPicker(){
    activeOverrideKey = null;
    if(subjectDrawer){ subjectDrawer.hidden = true; }
  }

  document.addEventListener('click', function(e){
    var box = e.target.closest ? e.target.closest('.lesson-box') : null;
    if(box && box.dataset.key){
      openSubjectPicker(box.dataset.key);
      return;
    }
    var pickerBtn = e.target.closest ? e.target.closest('.subject-picker-btn') : null;
    if(pickerBtn && activeOverrideKey){
      lessonOverrides[activeOverrideKey] = pickerBtn.dataset.subject;
      closeSubjectPicker();
      renderTagesplan(new Date());
      return;
    }
    if(e.target === subjectDrawer){
      closeSubjectPicker();
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.target.classList && e.target.classList.contains('lesson-sub-input')) return;
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var box = e.target.closest ? e.target.closest('.lesson-box') : null;
    if(box && box.dataset.key){
      e.preventDefault();
      openSubjectPicker(box.dataset.key);
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.classList && e.target.classList.contains('lesson-sub-input')){
      substituteTeachers[e.target.dataset.key] = e.target.value;
    }
  });

  if(subjectResetBtn){
    subjectResetBtn.addEventListener('click', function(){
      if(activeOverrideKey){ delete lessonOverrides[activeOverrideKey]; }
      closeSubjectPicker();
      renderTagesplan(new Date());
    });
  }
  if(subjectCancelBtn){
    subjectCancelBtn.addEventListener('click', closeSubjectPicker);
  }

  /* ---------- Höhe von "Was ist heute wichtig?" an "Witz des Tages" angleichen ---------- */
  var accentPanelEl = document.querySelector('.accent-panel');
  var pickerPanelEl = document.querySelector('.picker-panel');
  var dailyNotesEl = document.getElementById('dailyNotes');

  function syncPickerPanelHeight(){
    if(!accentPanelEl || !pickerPanelEl) return;
    var accentRect = accentPanelEl.getBoundingClientRect();
    var pickerRect = pickerPanelEl.getBoundingClientRect();
    var h = accentRect.bottom - pickerRect.top;
    if(h > 0){ pickerPanelEl.style.height = h + 'px'; }
  }

  /* Schrift im Notiz-Kasten verkleinern, falls der Text sonst nicht hineinpasst */
  function fitDailyNotesFont(){
    if(!dailyNotesEl) return;
    dailyNotesEl.style.fontSize = ''; // zurück zur responsiven CSS-Basisgröße
    var base = parseFloat(getComputedStyle(dailyNotesEl).fontSize);
    var minSize = base * 0.35;
    var size = base;
    var guard = 0;
    while(dailyNotesEl.scrollHeight > dailyNotesEl.clientHeight + 1 && size > minSize && guard < 60){
      size -= 1;
      dailyNotesEl.style.fontSize = size + 'px';
      guard++;
    }
  }

  function syncPickerPanel(){
    syncPickerPanelHeight();
    fitDailyNotesFont();
  }

  /* ---------- Timer-Kasten und Witz-des-Tages-Kasten auf die Timer-Breite verschmälern ---------- */
  var timerBoxEl = document.querySelector('.timer-box');

  function syncTimerWitzWidth(){
    if(!timerBoxEl || !accentPanelEl) return;
    // Erst lösen, um die natürliche (an den Inhalt angepasste) Breite des Timers zu ermitteln
    timerBoxEl.style.width = '';
    timerBoxEl.style.alignSelf = 'flex-start';
    var contentWidth = Math.ceil(timerBoxEl.getBoundingClientRect().width);
    if(contentWidth <= 0) return;
    timerBoxEl.style.width = contentWidth + 'px';
    accentPanelEl.style.width = contentWidth + 'px';
    accentPanelEl.style.alignSelf = 'flex-start';
  }

  /* ---------- Stundenkärtchen so vergrößern, dass der Tagesplan unten mit der linken Spalte abschließt ---------- */
  var colStackEl = document.querySelector('.col-stack');
  var tagesplanPanelEl = document.querySelector('.tagesplan-panel');

  function fitTagesplanCards(){
    if(!tagesplanBody || !colStackEl || !tagesplanPanelEl) return;
    if(!tagesplanBody.children.length) return; // noch nichts gerendert
    // Erst auf 1 zurücksetzen, um die natürliche (unskalierte) Höhe der Kärtchen zu messen
    tagesplanPanelEl.style.setProperty('--tp-scale', 1);
    tagesplanPanelEl.style.setProperty('--tp-wscale', 1);
    var naturalHeight = tagesplanBody.getBoundingClientRect().height;
    if(naturalHeight <= 0) return;
    // Die Kärtchen werden vor allem HÖHER, ihre Breite ist gedeckelt (--tp-wscale),
    // damit sie die linke Spalte nicht zusammendrücken und dadurch einen Rückkopplungs-
    // Effekt auslösen (schmalere Spalte → mehr Zeilenumbrüche → höhere Spalte → …).
    var scale = 1;
    for(var i = 0; i < 6; i++){
      var bodyTop = tagesplanBody.getBoundingClientRect().top;
      var colStackBottom = colStackEl.getBoundingClientRect().bottom;
      var targetHeight = colStackBottom - bodyTop;
      if(targetHeight <= 0) break;
      var newScale = targetHeight / naturalHeight;
      if(newScale < 0.6) newScale = 0.6;
      if(newScale > 2.6) newScale = 2.6;
      var newWScale = Math.min(newScale, 1.3);
      tagesplanPanelEl.style.setProperty('--tp-scale', newScale);
      tagesplanPanelEl.style.setProperty('--tp-wscale', newWScale);
      if(Math.abs(newScale - scale) < 0.002){ scale = newScale; break; }
      scale = newScale;
    }
  }

  function syncBoardLayout(){
    syncTimerWitzWidth();
    syncPickerPanel();
    fitTagesplanCards();
  }

  window.addEventListener('resize', syncBoardLayout);
  if(window.ResizeObserver && accentPanelEl){
    new ResizeObserver(syncBoardLayout).observe(accentPanelEl);
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(syncBoardLayout);
  }
  if(dailyNotesEl){
    dailyNotesEl.addEventListener('input', fitDailyNotesFont);
  }

  /* ---------- Init ---------- */
  renderDailyPick();
  tick();
  setInterval(tick, 1000);
  syncBoardLayout();
})();
</script>
